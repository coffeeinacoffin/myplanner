<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Planner ⭐</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300;400;700&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: linear-gradient(160deg, #fdf6f0 0%, #f5ede4 40%, #ece4da 100%);
  font-family: 'Quicksand', 'Apple SD Gothic Neo', sans-serif;
  color: #3a3230;
}
.sync-banner {
  padding: 6px 16px; text-align: center;
  font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 500;
  border-bottom: 1px solid rgba(0,0,0,0.06); transition: all 0.3s;
}
.sync-banner.ok { background: #e8f5e9; color: #4a7c59; }
.sync-banner.err { background: #fff3e0; color: #8a6d3b; }
.sync-banner.loading { background: #e3f2fd; color: #5a7fa0; }
.sync-banner.hidden { display: none; }
.data-bar { display: flex; gap: 8px; justify-content: flex-end; padding: 6px 16px; flex-wrap: wrap; }
.data-btn {
  padding: 5px 14px; border: 1px solid rgba(192,172,158,0.35);
  background: rgba(255,255,255,0.6); border-radius: 8px;
  font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 600;
  color: #6b5850; cursor: pointer; transition: all 0.2s;
}
.data-btn:hover { background: rgba(255,255,255,0.9); border-color: #6b5850; }
.planner-header {
  background: linear-gradient(135deg, #5c4a42 0%, #7a6458 100%);
  padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 4px 20px rgba(92,74,66,0.25); position: sticky; top: 0; z-index: 100;
}
.planner-title { font-family: 'Gaegu', cursive; font-size: 36px; font-weight: 700; color: #fdf6f0; }
.nav-tabs { display: flex; gap: 4px; background: rgba(255,255,255,0.12); border-radius: 12px; padding: 4px; }
.nav-tab {
  padding: 7px 16px; border: none; background: transparent; color: rgba(253,246,240,0.65);
  font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 500;
  cursor: pointer; border-radius: 9px; transition: all 0.25s;
}
.nav-tab:hover { color: #fdf6f0; background: rgba(255,255,255,0.08); }
.nav-tab.active { background: rgba(253,246,240,0.2); color: #fdf6f0; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.content-area { max-width: 1200px; margin: 0 auto; padding: 16px 12px 50px; }
.section-label { font-family: 'Gaegu', cursive; font-size: 28px; font-weight: 700; color: #7a6458; margin-bottom: 10px; }
.card {
  background: rgba(255,255,255,0.72); backdrop-filter: blur(12px);
  border-radius: 16px; border: 1px solid rgba(192,172,158,0.3);
  box-shadow: 0 2px 16px rgba(92,74,66,0.06); overflow: hidden;
}
.legend {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  margin-bottom: 12px; padding: 8px 14px; background: rgba(255,255,255,0.5);
  border-radius: 10px; font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 500; color: #9a8a80;
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(192,172,158,0.3); }

/* Schedule editor */
.schedule-editor {
  background: rgba(255,255,255,0.6); border-radius: 14px;
  border: 1px solid rgba(192,172,158,0.25); padding: 14px; margin-bottom: 16px;
}
.schedule-editor-title {
  font-family: 'Gaegu', cursive; font-size: 20px; font-weight: 700;
  color: #6b5850; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 6px;
}
.schedule-row { display: grid; grid-template-columns: 50px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; }
.schedule-day-label { font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 700; color: #6b5850; }
.schedule-input {
  border: 1px solid rgba(192,172,158,0.3); border-radius: 8px; padding: 6px 10px;
  font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 500; color: #3a3230;
  background: rgba(253,246,240,0.5); outline: none;
}
.schedule-input:focus { border-color: rgba(122,100,88,0.5); }
.schedule-input::placeholder { color: rgba(154,138,128,0.4); font-size: 11px; }
.schedule-save-btn {
  margin-top: 8px; padding: 7px 20px; border: none;
  background: linear-gradient(135deg,#5c4a42,#7a6458); color: #fdf6f0; border-radius: 8px;
  cursor: pointer; font-family: 'Quicksand', sans-serif; font-size: 12px; font-weight: 600;
}
.schedule-save-btn:hover { opacity: 0.85; }

/* Week nav */
.week-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
.week-title { font-family: 'Quicksand', sans-serif; font-size: 18px; font-weight: 600; color: #5c4a42; }
.week-today-btn {
  padding: 4px 12px; border: 1px solid rgba(122,100,88,0.3); background: rgba(255,255,255,0.6);
  border-radius: 8px; font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 600;
  color: #6b5850; cursor: pointer;
}
.week-today-btn:hover { background: rgba(255,255,255,0.9); }

/* Weekly grid */
.weekly-grid {
  display: grid; grid-template-columns: 80px repeat(7, 1fr);
  font-family: 'Quicksand', sans-serif; font-size: 11px;
}
.grid-header {
  background: linear-gradient(180deg, #6b5850 0%, #5c4a42 100%);
  color: #fdf6f0; padding: 8px 4px; text-align: center;
  font-weight: 700; font-size: 11px; letter-spacing: 0.5px;
}
.grid-header .header-date { font-size: 9px; font-weight: 500; opacity: 0.75; margin-top: 2px; }
.grid-header.time-col { font-size: 10px; }
.grid-header.today-col { background: linear-gradient(180deg, #8b6f5e 0%, #7a5e4e 100%); }
.time-cell {
  padding: 0 4px; display: flex; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 600; color: #9a8a80; background: rgba(245,237,228,0.5);
  border-bottom: 1px solid rgba(192,172,158,0.15); min-height: 38px;
}
.schedule-cell {
  border-bottom: 1px solid rgba(192,172,158,0.12); border-right: 1px solid rgba(192,172,158,0.08);
  min-height: 38px; position: relative; overflow: hidden;
}
.schedule-cell:hover { background: rgba(122,100,88,0.04); }
.cell-input {
  width: 100%; height: 100%; min-height: 38px; border: none; background: transparent;
  padding: 4px 6px; font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 500;
  color: #3a3230; outline: none; position: relative; z-index: 2;
}
.cell-input::placeholder { color: rgba(154,138,128,0.4); font-size: 9px; }
.cell-overlay {
  position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none;
}
.cell-overlay.class-full { top: 0; bottom: 0; background: rgba(180,140,110,0.22); }
.cell-overlay.class-top { top: 0; height: 50%; background: rgba(180,140,110,0.22); }
.cell-overlay.class-bottom { bottom: 0; height: 50%; background: rgba(180,140,110,0.22); }
.cell-overlay.transit-top {
  top: 0; height: 50%;
  background: repeating-linear-gradient(-45deg,rgba(180,160,140,0.12),rgba(180,160,140,0.12) 3px,transparent 3px,transparent 6px);
}
.cell-overlay.transit-bottom {
  bottom: 0; height: 50%;
  background: repeating-linear-gradient(-45deg,rgba(180,160,140,0.12),rgba(180,160,140,0.12) 3px,transparent 3px,transparent 6px);
}
.cell-overlay.transit-full {
  top: 0; bottom: 0;
  background: repeating-linear-gradient(-45deg,rgba(180,160,140,0.08),rgba(180,160,140,0.08) 3px,transparent 3px,transparent 6px);
}

/* Daily */
.daily-layout { display: grid; grid-template-columns: 1fr 300px; gap: 16px; }
@media (max-width: 800px) { .daily-layout { grid-template-columns: 1fr; } }
.daily-time-row {
  display: grid; grid-template-columns: 80px 28px 1fr;
  border-bottom: 1px solid rgba(192,172,158,0.12);
  min-height: 38px; position: relative; overflow: hidden;
}
.daily-time-row:hover { background: rgba(122,100,88,0.04); }
.daily-time-row.personal-block { background: linear-gradient(135deg, rgba(200,80,70,0.16) 0%, rgba(185,65,55,0.12) 100%); }
.daily-time-label {
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #9a8a80;
  border-right: 1px solid rgba(192,172,158,0.15);
  font-family: 'Quicksand', sans-serif; position: relative; z-index: 2;
}
.daily-input {
  border: none; background: transparent; padding: 6px 10px;
  font-family: 'Quicksand', sans-serif; font-size: 13px; font-weight: 500;
  color: #3a3230; outline: none; width: 100%; position: relative; z-index: 2;
}
.daily-input:focus { background: rgba(122,100,88,0.04); }
.daily-input::placeholder { color: rgba(154,138,128,0.35); font-size: 10px; }
.personal-check { width: 15px; height: 15px; cursor: pointer; accent-color: #c05050; position: relative; z-index: 2; }
.row-overlay { position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none; }
.row-overlay.class-full { top: 0; bottom: 0; background: rgba(180,140,110,0.18); }
.row-overlay.class-top { top: 0; height: 50%; background: rgba(180,140,110,0.18); }
.row-overlay.class-bottom { bottom: 0; height: 50%; background: rgba(180,140,110,0.18); }
.row-overlay.transit-top { top: 0; height: 50%; background: repeating-linear-gradient(-45deg,rgba(180,160,140,0.12),rgba(180,160,140,0.12) 3px,transparent 3px,transparent 6px); }
.row-overlay.transit-bottom { bottom: 0; height: 50%; background: repeating-linear-gradient(-45deg,rgba(180,160,140,0.12),rgba(180,160,140,0.12) 3px,transparent 3px,transparent 6px); }
.row-overlay.transit-full { top: 0; bottom: 0; background: repeating-linear-gradient(-45deg,rgba(180,160,140,0.08),rgba(180,160,140,0.08) 3px,transparent 3px,transparent 6px); }

.sidebar-card { background: rgba(255,255,255,0.72); backdrop-filter: blur(12px); border-radius: 14px; border: 1px solid rgba(192,172,158,0.25); padding: 14px; margin-bottom: 14px; }
.sidebar-title { font-family: 'Gaegu', cursive; font-size: 22px; font-weight: 700; color: #6b5850; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.text-area {
  width: 100%; border: 1px solid rgba(192,172,158,0.25); border-radius: 10px; padding: 10px 12px;
  font-family: 'Quicksand', sans-serif; font-size: 13px; font-weight: 500; color: #3a3230;
  background: rgba(253,246,240,0.5); resize: vertical; outline: none; min-height: 70px;
}
.text-area:focus { border-color: rgba(122,100,88,0.4); }
.text-area.small { min-height: 50px; }
.meal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meal-label { font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 500; color: #9a8a80; margin-bottom: 4px; }
.progress-bar-wrap { height: 6px; background: rgba(192,172,158,0.2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s, background 0.4s; }
.date-selector, .month-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 14px; }
.date-display, .month-title { font-family: 'Quicksand', sans-serif; font-size: 22px; font-weight: 600; color: #5c4a42; }
.nav-btn { border: none; background: rgba(122,100,88,0.1); color: #6b5850; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
.nav-btn:hover { background: rgba(122,100,88,0.2); }
.completion-badge { display: inline-flex; align-items: center; gap: 4px; font-family: 'Quicksand', sans-serif; font-size: 12px; color: #9a8a80; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; padding: 14px; }
.cal-header { text-align: center; font-family: 'Quicksand', sans-serif; font-size: 11px; font-weight: 600; color: #9a8a80; padding: 6px 0; }
.cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; cursor: pointer; background: rgba(255,255,255,0.4); border: 1px solid rgba(192,172,158,0.1); transition: all 0.2s; }
.cal-day:hover { background: rgba(255,255,255,0.7); border-color: rgba(122,100,88,0.2); transform: scale(1.04); }
.cal-day.today { border: 2px solid #7a6458; background: rgba(122,100,88,0.08); }
.cal-day.empty { background: transparent; border-color: transparent; cursor: default; }
.cal-day.empty:hover { transform: none; }
.cal-day-num { font-family: 'Quicksand', sans-serif; font-size: 13px; font-weight: 500; color: #5c4a42; }
.cal-emoji { font-size: 14px; margin-top: 1px; }
.hidden { display: none; }
</style>
</head>
<body>
<div id="sync-banner" class="sync-banner loading">☁️ Firebase 연결 중...</div>
<div class="planner-header">
  <div class="planner-title">⭐ My Planner</div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('weekly')">Weekly</button>
    <button class="nav-tab" onclick="switchView('daily')">Daily</button>
    <button class="nav-tab" onclick="switchView('monthly')">Monthly</button>
  </div>
</div>
<div class="data-bar">
  <button class="data-btn" onclick="exportData()">📥 Export</button>
  <button class="data-btn" onclick="document.getElementById('import-file').click()">📤 Import</button>
  <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
</div>
<div class="content-area">
  <div id="view-weekly"></div>
  <div id="view-daily" class="hidden"></div>
  <div id="view-monthly" class="hidden"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCjgbJB0LIqDKCwp11I-0QfzmbMQmT1V_E",
  authDomain: "myplanner-b1954.firebaseapp.com",
  projectId: "myplanner-b1954",
  storageBucket: "myplanner-b1954.firebasestorage.app",
  messagingSenderId: "989178592123",
  appId: "1:989178592123:web:63b3b9d77f75674f229bde"
};
let db = null, firebaseReady = false;
const DOC_ID = "planner_main";
try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); firebaseReady = true; } catch(e) { console.error(e); }
function showBanner(t, m) { const b = document.getElementById('sync-banner'); b.className='sync-banner '+t; b.textContent=m; if(t==='ok') setTimeout(()=>b.classList.add('hidden'),2500); }

const DAYS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const HOURS = []; for(let h=8;h<=27;h++) HOURS.push(h);
const ALL_HALF = []; for(let t=8;t<=27;t+=0.5) ALL_HALF.push(t);
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DEFAULT_SCHEDULE = { MON:"10:30~13:30, 15:00~16:30", TUE:"12:00~16:30", WED:"09:00~12:00, 15:00~16:30", THU:"09:00~12:00, 15:00~16:30", FRI:"13:30~17:00", SAT:"", SUN:"" };

// ── Week helpers ──
function getMonday(d) {
  const dt = new Date(d); const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff); dt.setHours(0,0,0,0); return dt;
}
function getWeekDates(mondayDate) {
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mondayDate); d.setDate(d.getDate() + i);
    dates.push(d);
  }
  return dates;
}
function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtShort(d) { return `${d.getMonth()+1}/${d.getDate()}`; }

// ── Schedule ──
function parseSchedule(str) {
  if (!str || !str.trim()) return [];
  return str.split(',').map(s => {
    const m = s.trim().match(/(\d{1,2}):(\d{2})\s*[~\-]\s*(\d{1,2}):(\d{2})/);
    if (!m) return null;
    return [parseInt(m[1])+parseInt(m[2])/60, parseInt(m[3])+parseInt(m[4])/60];
  }).filter(Boolean);
}
function getClassSchedule() {
  const s = state.classSchedule || {};
  const r = {}; DAYS.forEach(d => { r[d] = parseSchedule(s[d] || DEFAULT_SCHEDULE[d] || ''); }); return r;
}
function formatTime(t) {
  const h = t >= 24 ? t-24 : t;
  const hour = h > 12 ? h-12 : (h===0?12:h);
  return `${Math.floor(hour)}:00 ${(h>=12&&h<24)?'PM':'AM'}`;
}

// ── Cell overlays ──
function getCellOverlays(classRanges, hourStart) {
  function halfStatus(hs, he) {
    for (const [s,e] of classRanges) { if (hs < e && he > s) return 'class'; }
    for (const [s,e] of classRanges) {
      if (hs >= s-0.5 && he <= s && hs < s) return 'transit';
      if (hs >= e && he <= e+0.5 && he > e) return 'transit';
    }
    return 'free';
  }
  const ts = halfStatus(hourStart, hourStart+0.5);
  const bs = halfStatus(hourStart+0.5, hourStart+1);
  const ov = [];
  if (ts===bs && ts!=='free') ov.push({half:'full',type:ts});
  else { if(ts!=='free') ov.push({half:'top',type:ts}); if(bs!=='free') ov.push({half:'bottom',type:bs}); }
  return ov;
}
function isHourBlocked(cr, h) { const o=getCellOverlays(cr,h); return o.length===1&&o[0].half==='full'&&o[0].type==='class'; }
function overlayHtml(ov, pre) { return ov.map(o=>`<div class="${pre} ${o.type}-${o.half}"></div>`).join(''); }

// ── State ──
function defaultState() { return { dailyTimeline:{}, dailyTasks:{}, dailyMeals:{}, dailyExercise:{}, dailyPersonal:{}, classSchedule:{}, scheduleHistory:{}, weeklyNotes:{} }; }
let state = defaultState();
let currentView = "weekly";
let selectedDate = (()=>{ const n=new Date(); return {year:n.getFullYear(),month:n.getMonth(),day:n.getDate()}; })();
let currentMonth = {year:selectedDate.year,month:selectedDate.month};
let currentWeekMonday = getMonday(new Date());
let scheduleEditorOpen = false;

// ── Firebase ──
let saveTimer = null;
function debouncedSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveToFirebase, 800); }
async function saveToFirebase() {
  if(!firebaseReady||!db) return;
  try { await db.collection("planners").doc(DOC_ID).set(state); showBanner('ok','☁️ 저장 완료!'); }
  catch(e) { showBanner('err','⚠️ 저장 실패 — '+e.message); }
}
async function getFlashcardLog(ds) {
  if(!firebaseReady||!db) return null;
  try { const d=await db.collection("flashcard").doc("flashcard_log").get(); if(d.exists&&d.data().log&&d.data().log[ds]) return d.data().log[ds]; return null; } catch{return null;}
}
let unsubscribe=null;
async function loadFromFirebase() {
  if(!firebaseReady||!db){showBanner('err','⚠️ Firebase 연결 실패');return;}
  showBanner('loading','☁️ 데이터 불러오는 중...');
  unsubscribe=db.collection("planners").doc(DOC_ID).onSnapshot((doc)=>{
    if(doc.exists){const d=doc.data();if(!document.activeElement||document.activeElement.tagName==='BODY'){state={...defaultState(),...d};renderCurrentView();showBanner('ok','🔄 실시간 동기화됨!');}else{state={...defaultState(),...d};}}
    else{showBanner('ok','☁️ 연결 완료!');}
  },(err)=>{showBanner('err','⚠️ '+err.message);});
}

function exportData() {
  const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b);
  const n=new Date(); a.download=`planner_${n.getFullYear()}${String(n.getMonth()+1).padStart(2,'0')}${String(n.getDate()).padStart(2,'0')}.json`; a.click();
}
function importData(ev) {
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=(e)=>{try{state={...defaultState(),...JSON.parse(e.target.result)};debouncedSave();renderCurrentView();alert('✅ 불러왔습니다!');}catch{alert('❌ 파일 오류');}};
  r.readAsText(f); ev.target.value='';
}

function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function getFirstDay(y,m){const d=new Date(y,m,1).getDay();return d===0?6:d-1;}

function getCompletion(dk) {
  const tl=state.dailyTimeline[dk]||{}, pe=state.dailyPersonal[dk]||{};
  const p=dk.split('-'), dow=new Date(+p[0],+p[1]-1,+p[2]).getDay();
  const dn=["SUN","MON","TUE","WED","THU","FRI","SAT"][dow];
  const cr=getClassSchedule()[dn]||[];
  let fillable=0,filled=0;
  ALL_HALF.forEach(t=>{
    const isC=cr.some(([s,e])=>t>=s&&t<e);
    const isT=!isC&&cr.some(([s,e])=>(t>=s-0.5&&t<s)||(t>=e&&t<e+0.5));
    if(isC||isT)return; if(pe[t])return;
    fillable++; if(tl[t]&&tl[t].trim())filled++;
  });
  return fillable>0?filled/fillable:0;
}

function getEmoji(p){return p>=80?'🤩':p>=65?'😊':p>=50?'🙂':p>=35?'😦':p>=20?'😴':'😈';}
function getBarColor(p){return p>=80?'linear-gradient(90deg,#6dbb5a,#4da03a)':p>=65?'linear-gradient(90deg,#8ab06a,#6d9a50)':p>=50?'linear-gradient(90deg,#a8c060,#8aaa45)':p>=35?'linear-gradient(90deg,#c4a55a,#b09040)':p>=20?'linear-gradient(90deg,#c08070,#a06050)':'linear-gradient(90deg,#9a7090,#805080)';}
function getCalEmoji(c){return c>=0.8?'🤩':c>=0.65?'😊':c>=0.5?'🙂':c>=0.35?'😦':c>=0.2?'😴':c>0?'😈':'';}

function renderCurrentView(){if(currentView==='weekly')renderWeekly();else if(currentView==='daily')renderDaily();else renderMonthly();}
function switchView(v){
  currentView=v;
  document.querySelectorAll('.nav-tab').forEach((b,i)=>b.classList.toggle('active',["weekly","daily","monthly"][i]===v));
  ['weekly','daily','monthly'].forEach(id=>document.getElementById('view-'+id).classList.toggle('hidden',id!==v));
  renderCurrentView();
}

// ── WEEKLY ──
function renderWeekly() {
  const weekDates = getWeekDates(currentWeekMonday);
  const today = new Date(); today.setHours(0,0,0,0);
  const cs = getClassSchedule();
  const schedRaw = state.classSchedule || {};
  const weekLabel = `${fmtShort(weekDates[0])} — ${fmtShort(weekDates[6])}`;

  // Schedule editor
  let editorHtml = `<div class="schedule-editor">
    <div class="schedule-editor-title" onclick="scheduleEditorOpen=!scheduleEditorOpen;renderWeekly()">
      ⚙️ Class Time Settings ${scheduleEditorOpen?'▲':'▼'}
    </div>`;
  if (scheduleEditorOpen) {
    const history = state.scheduleHistory || [];
    editorHtml += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <input type="checkbox" id="sched-copy-last" style="accent-color:#6b5850;width:15px;height:15px;cursor:pointer;" onchange="copyLastWeekSchedule(this.checked)">
      <label for="sched-copy-last" style="font-family:'Quicksand',sans-serif;font-size:12px;font-weight:500;color:#6b5850;cursor:pointer;">📋 지난주와 동일하게 입력</label>
    </div>`;
    DAYS.forEach(d => {
      const val = schedRaw[d] !== undefined ? schedRaw[d] : (DEFAULT_SCHEDULE[d]||'');
      editorHtml += `<div class="schedule-row"><span class="schedule-day-label">${d}</span>
        <input class="schedule-input" id="sched-${d}" value="${escHtml(val)}" placeholder="09:00~12:00, 14:00~16:30"></div>`;
    });
    editorHtml += `<button class="schedule-save-btn" onclick="saveSchedule()">💾 저장 및 적용</button>`;
  }
  editorHtml += `</div>`;

  let html = `<div class="section-label">⭐ Weekly Schedule</div>
    <div class="week-nav">
      <button class="nav-btn" onclick="shiftWeek(-1)">‹</button>
      <div class="week-title">${weekLabel}</div>
      <button class="nav-btn" onclick="shiftWeek(1)">›</button>
      <button class="week-today-btn" onclick="goThisWeek()">Today</button>
    </div>
    ${editorHtml}
    <div class="legend">
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(180,140,110,0.22)"></div><span>수업</span></div>
      <div class="legend-item"><div class="legend-swatch" style="background:repeating-linear-gradient(-45deg,rgba(180,160,140,0.15),rgba(180,160,140,0.15) 3px,transparent 3px,transparent 6px)"></div><span>이동</span></div>
      <div class="legend-item"><div class="legend-swatch" style="background:rgba(255,255,255,0.6)"></div><span>자유 시간</span></div>
    </div>
    <div class="card" style="overflow-x:auto"><div class="weekly-grid" style="min-width:780px">
      <div class="grid-header time-col">TIME</div>`;

  weekDates.forEach((d, i) => {
    const isToday = d.getTime() === today.getTime();
    html += `<div class="grid-header ${isToday?'today-col':''}" style="cursor:pointer" onclick="goToDay(${d.getFullYear()},${d.getMonth()},${d.getDate()})">
      ${DAYS[i]}<div class="header-date">${fmtShort(d)}</div>
    </div>`;
  });

  HOURS.forEach(h => {
    html += `<div class="time-cell">${formatTime(h)}</div>`;
    weekDates.forEach((d, i) => {
      const dk = fmtDate(d);
      const dayName = DAYS[i];
      const classRanges = cs[dayName] || [];
      const overlays = getCellOverlays(classRanges, h);
      const blocked = isHourBlocked(classRanges, h);
      const val = (state.dailyTimeline[dk] || {})[h] || '';
      const ph = overlays.some(o=>o.type==='class') ? '수업' : '';

      html += `<div class="schedule-cell">${overlayHtml(overlays,'cell-overlay')}`;
      if (!blocked) {
        html += `<input class="cell-input" value="${escHtml(val)}" placeholder="${ph}"
          oninput="writeTimeline('${dk}',${h},this.value)">`;
      }
      html += `</div>`;
    });
  });
  html += `</div></div>`;
  document.getElementById('view-weekly').innerHTML = html;
}

function writeTimeline(dk, h, val) {
  if (!state.dailyTimeline[dk]) state.dailyTimeline[dk] = {};
  state.dailyTimeline[dk][h] = val;
  state.dailyTimeline[dk][h + 0.5] = val; // fill both half-hours
  debouncedSave();
}

function shiftWeek(delta) {
  currentWeekMonday = new Date(currentWeekMonday);
  currentWeekMonday.setDate(currentWeekMonday.getDate() + delta * 7);
  renderWeekly();
}
function goThisWeek() { currentWeekMonday = getMonday(new Date()); renderWeekly(); }

function copyLastWeekSchedule(checked) {
  const history = state.scheduleHistory || [];
  const last = history.length > 0 ? history[history.length-1] : null;
  DAYS.forEach(d => {
    const input = document.getElementById('sched-'+d); if(!input) return;
    if (checked && last && last.schedule && last.schedule[d] !== undefined) { input.value = last.schedule[d]; }
    else { const sr = state.classSchedule||{}; input.value = sr[d]!==undefined ? sr[d] : (DEFAULT_SCHEDULE[d]||''); }
  });
}
function saveSchedule() {
  if(!state.classSchedule) state.classSchedule={};
  if(!state.scheduleHistory) state.scheduleHistory=[];
  const old={}; DAYS.forEach(d=>{old[d]=state.classSchedule[d]||DEFAULT_SCHEDULE[d]||'';});
  if(DAYS.some(d=>old[d])){
    const now=new Date();
    state.scheduleHistory.push({date:fmtDate(now),schedule:{...old}});
    if(state.scheduleHistory.length>10) state.scheduleHistory=state.scheduleHistory.slice(-10);
  }
  DAYS.forEach(d=>{const i=document.getElementById('sched-'+d);if(i)state.classSchedule[d]=i.value;});
  debouncedSave(); renderWeekly(); alert('✅ 수업 시간이 저장되었습니다!');
}

// ── Personal ──
function togglePersonal(dk, h) {
  if(!state.dailyPersonal[dk]) state.dailyPersonal[dk]={};
  const pe=state.dailyPersonal[dk];
  if(pe[h]){delete pe[h];delete pe[h+0.5];}else{pe[h]=true;pe[h+0.5]=true;}
  debouncedSave(); renderDaily();
}

// ── DAILY ──
function renderDaily() {
  const dk=dateKey(selectedDate.year,selectedDate.month,selectedDate.day);
  const comp=getCompletion(dk), pct=Math.round(comp*100);
  const dow=new Date(selectedDate.year,selectedDate.month,selectedDate.day).getDay();
  const dayName=["SUN","MON","TUE","WED","THU","FRI","SAT"][dow];
  const cs=getClassSchedule(), classRanges=cs[dayName]||[];
  const tasks=state.dailyTasks[dk]||'', meals=state.dailyMeals[dk]||{}, exercise=state.dailyExercise[dk]||'';

  const targetDate=new Date(2028,0,3),currentDate=new Date(selectedDate.year,selectedDate.month,selectedDate.day);
  const diffDays=Math.ceil((targetDate-currentDate)/86400000);
  const ddayText=diffDays>0?`D-${diffDays}`:diffDays===0?'D-Day 🎉':`D+${Math.abs(diffDays)}`;

  let html=`<div class="date-selector">
      <button class="nav-btn" onclick="shiftDate(-1)">‹</button>
      <div class="date-display">${selectedDate.year}. ${selectedDate.month+1}. ${selectedDate.day} (${dayName})</div>
      <button class="nav-btn" onclick="shiftDate(1)">›</button>
    </div>
    <div style="text-align:center;margin-bottom:14px">
      <div style="display:inline-block;background:linear-gradient(135deg,#5c4a42,#7a6458);color:#fdf6f0;padding:4px 14px;border-radius:20px;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:700;margin-bottom:6px;">📅 ${ddayText}</div>
      <div class="completion-badge">달성률 ${pct}% ${getEmoji(pct)}</div>
      <div class="progress-bar-wrap" style="max-width:240px;margin:4px auto 0"><div class="progress-bar-fill" style="width:${pct}%;background:${getBarColor(pct)}"></div></div>
    </div>
    <div class="daily-layout"><div>
      <div class="section-label">⏰ Timeline</div>
      <div class="legend" style="margin-bottom:8px;">
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(180,140,110,0.22)"></div><span>수업</span></div>
        <div class="legend-item"><div class="legend-swatch" style="background:rgba(200,80,70,0.20)"></div><span>개인 스케줄</span></div>
        <div class="legend-item"><span style="font-size:13px">☑️</span><span>체크 → 달성률 제외</span></div>
      </div><div class="card">`;

  HOURS.forEach(h=>{
    const overlays=getCellOverlays(classRanges,h), blocked=isHourBlocked(classRanges,h);
    const pe=state.dailyPersonal[dk]||{}, isP=!!pe[h];
    const val=(state.dailyTimeline[dk]||{})[h]||'';
    const rc=isP?'daily-time-row personal-block':'daily-time-row';

    html+=`<div class="${rc}">${overlayHtml(overlays,'row-overlay')}
      <div class="daily-time-label">${formatTime(h)}</div>`;
    if(blocked){
      html+=`<div></div><input class="daily-input" value="${escHtml(val)}" placeholder="📚 수업"
        oninput="writeDailyTimeline('${dk}',${h},this.value)">`;
    } else {
      const ph=isP?'📌 개인 스케줄':(overlays.some(o=>o.type==='class')?'📚 수업':'할 일을 입력하세요...');
      html+=`<div style="display:flex;align-items:center;justify-content:center;">
        <input type="checkbox" class="personal-check" ${isP?'checked':''}
          onchange="togglePersonal('${dk}',${h})" title="개인 스케줄 (달성률 제외)">
      </div>
      <input class="daily-input" value="${escHtml(val)}" placeholder="${ph}"
        oninput="writeDailyTimeline('${dk}',${h},this.value)">`;
    }
    html+=`</div>`;
  });

  html+=`</div></div><div>
    <div class="section-label">📋 Side Notes</div>
    <div class="sidebar-card" id="flashcard-widget">
      <div class="sidebar-title">📚 Law Flashcards?</div>
      <div style="font-family:'Quicksand',sans-serif;font-size:13px;color:#9a8a80;">불러오는 중...</div>
    </div>
    <div class="sidebar-card"><div class="sidebar-title">✓ To Do List</div>
      <textarea class="text-area" placeholder="- 과제 제출&#10;- 이메일 확인"
        oninput="state.dailyTasks['${dk}']=this.value;debouncedSave()">${escHtml(tasks)}</textarea></div>
    <div class="sidebar-card"><div class="sidebar-title">🍽 Meal Log</div>
      <div class="meal-grid">
        <div><div class="meal-label">점심 Lunch</div><textarea class="text-area small" placeholder="메뉴"
          oninput="if(!state.dailyMeals['${dk}'])state.dailyMeals['${dk}']={};state.dailyMeals['${dk}'].lunch=this.value;debouncedSave()">${escHtml(meals.lunch||'')}</textarea></div>
        <div><div class="meal-label">저녁 Dinner</div><textarea class="text-area small" placeholder="메뉴"
          oninput="if(!state.dailyMeals['${dk}'])state.dailyMeals['${dk}']={};state.dailyMeals['${dk}'].dinner=this.value;debouncedSave()">${escHtml(meals.dinner||'')}</textarea></div>
      </div></div>
    <div class="sidebar-card"><div class="sidebar-title">💪 Workout Log</div>
      <textarea class="text-area" style="min-height:60px" placeholder="운동 종류, 시간, 세트&#10;예: 러닝 30분"
        oninput="state.dailyExercise['${dk}']=this.value;debouncedSave()">${escHtml(exercise)}</textarea></div>
  </div></div>`;

  document.getElementById('view-daily').innerHTML = html;

  getFlashcardLog(dk).then(log=>{
    const w=document.getElementById('flashcard-widget');if(!w)return;
    if(log&&log.sessions>0){
      const p=Math.round((log.correct/log.total)*100);
      w.innerHTML=`<div class="sidebar-title">📚 Law Flashcards?</div>
        <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:28px;">⭕</span>
        <div style="font-family:'Quicksand',sans-serif;"><div style="font-size:14px;font-weight:700;color:#4a7c59;">학습 완료!</div>
        <div style="font-size:11px;color:#9a8a80;margin-top:2px;">${log.sessions}회 · ${log.correct}/${log.total} 정답 (${p}%)</div></div></div>
        <a href="https://coffeeinacoffin.github.io/law_flashcard/" target="_blank" style="display:block;margin-top:10px;padding:8px;border-radius:8px;background:rgba(122,100,88,0.08);text-align:center;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:600;color:#6b5850;text-decoration:none;">🔗 이어서 학습하기</a>`;
    } else {
      w.innerHTML=`<div class="sidebar-title">📚 Law Flashcards?</div>
        <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:28px;">❌</span>
        <div style="font-family:'Quicksand',sans-serif;"><div style="font-size:14px;font-weight:700;color:#c05050;">미학습</div>
        <div style="font-size:11px;color:#9a8a80;margin-top:2px;">오늘 아직 학습 기록이 없어요</div></div></div>
        <a href="https://coffeeinacoffin.github.io/law_flashcard/" target="_blank" style="display:block;margin-top:10px;padding:8px;border-radius:8px;background:linear-gradient(135deg,#5c4a42,#7a6458);text-align:center;font-family:'Quicksand',sans-serif;font-size:12px;font-weight:600;color:#fdf6f0;text-decoration:none;">📖 지금 학습하러 가기</a>`;
    }
  });
}

function writeDailyTimeline(dk, h, val) {
  if(!state.dailyTimeline[dk]) state.dailyTimeline[dk]={};
  state.dailyTimeline[dk][h]=val;
  state.dailyTimeline[dk][h+0.5]=val;
  debouncedSave(); updateBadge(dk);
}

function updateBadge(dk) {
  const c=getCompletion(dk),p=Math.round(c*100);
  const b=document.querySelector('.completion-badge'),f=document.querySelector('.progress-bar-fill');
  if(b)b.textContent=`달성률 ${p}% ${getEmoji(p)}`;
  if(f){f.style.width=p+'%';f.style.background=getBarColor(p);}
}
function shiftDate(delta) {
  const d=new Date(selectedDate.year,selectedDate.month,selectedDate.day+delta);
  selectedDate={year:d.getFullYear(),month:d.getMonth(),day:d.getDate()}; renderDaily();
}

// ── MONTHLY ──
function renderMonthly() {
  const{year,month}=currentMonth, dim=getDaysInMonth(year,month), fd=getFirstDay(year,month), today=new Date();
  let html=`<div class="month-nav"><button class="nav-btn" onclick="shiftMonth(-1)">‹</button>
    <div class="month-title">${MONTH_NAMES[month]} ${year}</div>
    <button class="nav-btn" onclick="shiftMonth(1)">›</button></div>
    <div class="legend" style="justify-content:center">
      <div class="legend-item"><span>🤩</span><span>80%+</span></div><div class="legend-item"><span>😊</span><span>65%+</span></div>
      <div class="legend-item"><span>🙂</span><span>50%+</span></div><div class="legend-item"><span>😦</span><span>35%+</span></div>
      <div class="legend-item"><span>😴</span><span>20%+</span></div><div class="legend-item"><span>😈</span><span>~20%</span></div>
    </div><div class="card"><div class="calendar-grid">`;
  ["MON","TUE","WED","THU","FRI","SAT","SUN"].forEach(d=>{html+=`<div class="cal-header">${d}</div>`;});
  for(let i=0;i<fd;i++) html+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=dim;d++){
    const dk=dateKey(year,month,d),c=getCompletion(dk),ce=getCalEmoji(c);
    const isT=today.getFullYear()===year&&today.getMonth()===month&&today.getDate()===d;
    html+=`<div class="cal-day ${isT?'today':''}" onclick="goToDay(${year},${month},${d})" title="${Math.round(c*100)}%">
      <div class="cal-day-num">${d}</div>${ce?`<div class="cal-emoji">${ce}</div>`:''}</div>`;
  }
  html+=`</div></div>`;
  document.getElementById('view-monthly').innerHTML=html;
}
function shiftMonth(d){let m=currentMonth.month+d,y=currentMonth.year;if(m<0){m=11;y--;}if(m>11){m=0;y++;}currentMonth={year:y,month:m};renderMonthly();}
function goToDay(y,m,d){selectedDate={year:y,month:m,day:d};switchView('daily');}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

loadFromFirebase().then(()=>renderWeekly());
</script>
